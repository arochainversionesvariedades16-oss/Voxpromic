name: Compilar APK VoxPro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake libltdl-dev
          pip install --upgrade "cython<3.0" "buildozer==1.5.0"

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxPro-Instalador-APK
          path: bin/*.apk
